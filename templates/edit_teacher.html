
{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="text-primary">Edit Teacher</h2>

        <p class="text-muted">
            Update teacher account details
        </p>

        <hr>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text"
                       class="form-control"
                       value="{{ teacher.user.username }}"
                       readonly>
            </div>

            <div class="mb-3">
                <label class="form-label">First Name</label>
                <input type="text"
                       name="first_name"
                       class="form-control"
                       value="{{ teacher.user.first_name }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Last Name</label>
                <input type="text"
                       name="last_name"
                       class="form-control"
                       value="{{ teacher.user.last_name }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       value="{{ teacher.user.email }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text"
                       name="phone"
                       class="form-control"
                       value="{{ teacher.phone }}">
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i>
                Update Teacher
            </button>

            <a href="/dashboard/teachers/"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
