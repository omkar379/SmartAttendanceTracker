
{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="text-primary">Edit Department</h2>
        <p class="text-muted">Update department details.</p>

        <hr>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Department Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ department.name }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Department Code</label>
                <input
                    type="text"
                    name="code"
                    class="form-control"
                    value="{{ department.code }}"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Update Department
            </button>

            <a href="{% url 'admin_departments' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
