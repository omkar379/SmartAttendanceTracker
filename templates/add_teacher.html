
{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="text-primary">Add New Teacher</h2>

        <p class="text-muted">
            Register a new teacher account
        </p>

        <hr>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username *</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password *</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">First Name</label>
                <input type="text"
                       name="first_name"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Last Name</label>
                <input type="text"
                       name="last_name"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       name="email"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text"
                       name="phone"
                       class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-person-plus"></i>
                Add Teacher
            </button>

            <a href="/dashboard/teachers/"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
