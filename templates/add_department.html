{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <div class="card shadow p-4">

        <h2 class="text-primary">Add Department</h2>
        <p class="text-muted">Enter department details below.</p>

        <hr>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Department Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter department name"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Department Code</label>
                <input
                    type="text"
                    name="code"
                    class="form-control"
                    placeholder="Enter department code"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Add Department
            </button>

            <a href="/dashboard/admin/" class="btn btn-secondary">
                Back to Dashboard
            </a>
        </form>

    </div>
</div>

{% endblock %}
