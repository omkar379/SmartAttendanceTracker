
{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="text-primary">Add Subject</h2>
        <p class="text-muted">Enter subject details below.</p>

        <hr>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Subject Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter subject name"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Subject Code</label>
                <input
                    type="text"
                    name="code"
                    class="form-control"
                    placeholder="Enter subject code"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Select Classroom</label>

                <select name="classroom" class="form-select" required>
                    <option value="">Select Classroom</option>

                    {% for classroom in classrooms %}
                        <option value="{{ classroom.id }}">
                            {{ classroom.name }} - {{ classroom.department.name }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Add Subject
            </button>

            <a href="{% url 'admin_subjects' %}"
               class="btn btn-secondary">
                Back to Subjects
            </a>

        </form>

    </div>

</div>

{% endblock %}
