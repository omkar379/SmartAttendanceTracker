
{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="text-primary">Edit Subject</h2>
        <p class="text-muted">Update subject details.</p>

        <hr>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Subject Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ subject.name }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Subject Code</label>
                <input
                    type="text"
                    name="code"
                    class="form-control"
                    value="{{ subject.code }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Select Classroom</label>

                <select name="classroom" class="form-select" required>

                    {% for classroom in classrooms %}
                        <option
                            value="{{ classroom.id }}"
                            {% if classroom.id == subject.classroom_id %}
                                selected
                            {% endif %}
                        >
                            {{ classroom.name }} - {{ classroom.department.name }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Update Subject
            </button>

            <a href="{% url 'admin_subjects' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
